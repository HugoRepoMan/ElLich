services:
  postgres-auditoria:
    image: postgres:16-alpine
    container_name: postgres-auditoria
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-auditoria_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_auditoria_data:/var/lib/postgresql/data

volumes:
  postgres_auditoria_data:
