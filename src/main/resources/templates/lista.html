<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Lich - Auditoría de Endpoints</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Auditoría de Endpoints</h2>
        <a href="/" class="btn btn-primary">Inicio</a>
    </div>

    <!-- Formulario para pruebas manuales (Opcional) -->
    <div class="card mb-4">
        <div class="card-header">
            <h5 class="mb-0">Registro Manual de Agente</h5>
        </div>
        <div class="card-body">
            <form method="post" th:action="@{/agentes/guardar}" class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Código</label>
                    <input type="text" class="form-control" name="codigo" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Hostname</label>
                    <input type="text" class="form-control" name="hostname" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Sistema</label>
                    <input type="text" class="form-control" name="system" placeholder="Windows/Linux">
                </div>
                <div class="col-md-2">
                    <label class="form-label">CPU %</label>
                    <input type="number" step="0.01" class="form-control" name="cpuPercent">
                </div>
                <div class="col-md-2">
                    <label class="form-label">RAM (MB)</label>
                    <input type="number" step="0.01" class="form-control" name="consumoMemoriaMb">
                </div>
                <div class="col-12 d-flex justify-content-end">
                    <button type="submit" class="btn btn-success">Guardar/Actualizar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Tabla de Agentes -->
    <div class="card">
        <div class="card-header">
            <h5 class="mb-0">Agentes Registrados</h5>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th scope="col">Código</th>
                        <th scope="col">Hostname</th>
                        <th scope="col">Sistema</th>
                        <th scope="col">CPU %</th>
                        <th scope="col">RAM (MB)</th>
                        <th scope="col">Estado</th>
                        <th scope="col">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(agentes)}">
                        <td colspan="7" class="text-center text-muted">No hay agentes registrados.</td>
                    </tr>
                    <tr th:each="agente : ${agentes}">
                        <td th:text="${agente.codigo}">AGT-00000000</td>
                        <td th:text="${agente.hostname}">localhost</td>
                        <td th:text="${agente.system} ?: 'Desconocido'">Windows</td>
                        <td th:text="${agente.cpuPercent} ?: 0">0.0</td>
                        <td th:text="${agente.consumoMemoriaMb} ?: 0">0.0</td>
                        <td>
                            <span th:if="${agente.activo}" class="badge bg-success">Activo</span>
                            <span th:unless="${agente.activo}" class="badge bg-danger">Inactivo</span>
                        </td>
                        <td>
                            <a th:href="@{/agentes/{codigo}/auditoria(codigo=${agente.codigo})}"
                               class="btn btn-sm btn-outline-info">
                                Ver Actividad
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
