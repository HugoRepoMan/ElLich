<!doctype html>
<!--
CONTEXTO INICIAL
Pantalla Ver Actividad de un agente concreto: /agentes/{codigo}/auditoria.
Recibe del controlador sus metadatos y el historial legado. Los fragmentos incorporan
la captura web, el área de prueba, la reconstrucción y el feed filtrado por ese agente.
audit-spy.js envía las interacciones y audit-dashboard.js escucha los eventos confirmados.
La sección Python permanece separada para distinguir ambas fuentes de información.
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}"><meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:text="${'Auditoría · ' + agente.codigo + ' · ElLich'}">Auditoría · ElLich</title>
    <link rel="stylesheet" th:href="@{/css/audit-live.css}">
    <script defer th:src="@{/js/audit-spy.js}"></script>
    <script type="module" th:src="@{/js/audit-dashboard.js}"></script>
</head>
<body class="audit-page"><main class="audit-shell">
    <header class="audit-header">
        <div><h1>Auditoría del agente <span th:text="${agente.codigo}"></span></h1>
            <p><strong th:text="${agente.hostname}"></strong> · <span th:text="${agente.system ?: 'Sistema no informado'}"></span></p></div>
        <a th:href="@{/agentes}">Volver a agentes</a>
    </header>
    <section th:replace="~{fragments/audit-capture :: panel('agent-audit', ${agente.codigo})}"></section>
    <section th:replace="~{fragments/audit-capture :: demo}"></section>
    <section th:replace="~{fragments/audit-dashboard :: feed(${agente.codigo})}"></section>
    <details class="audit-card" style="margin-top:24px">
        <summary>Historial del agente Python (canal independiente)</summary>
        <p th:if="${#lists.isEmpty(eventos)}">No hay registros del agente Python. La captura web de arriba funciona independientemente de ese canal.</p>
        <table th:unless="${#lists.isEmpty(eventos)}">
            <thead><tr><th>Timestamp</th><th>Tipo</th><th>Valor</th><th>Modificadores</th><th>Ventana</th></tr></thead>
            <tbody><tr th:each="event : ${eventos}">
                <td th:text="${event.occurredAtMs}"></td><td th:text="${event.inputType}"></td>
                <td th:text="${event.value}"></td><td th:text="${event.modifiers}"></td><td th:text="${event.activeWindow}"></td>
            </tr></tbody>
        </table>
    </details>
</main></body></html>
