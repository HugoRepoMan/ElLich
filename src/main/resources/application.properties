spring.application.name=auditoria-endpoints-monolito
server.port=8080

# ===================================================================
# Configuracion de Base de Datos PostgreSQL mediante Variables de Entorno
# (Incluye valores por defecto de respaldo para entorno de desarrollo local)
# ===================================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auditoria_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# Configuracion de JPA / Hibernate (Operacion Sincrona/Bloqueante)
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# Configuracion de Thymeleaf
# ===================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
