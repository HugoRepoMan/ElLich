# CONTEXTO INICIAL
# Configuración externa del servidor, PostgreSQL, JPA, Thymeleaf y la seguridad web.
# Las expresiones de variables de entorno permiten cambiar conexión, origen y claves
# sin editar el código. Hibernate agrupa INSERT de la nueva entidad de auditoría.
# ddl-auto=update conserva el comportamiento de desarrollo del proyecto; el despliegue
# administrado puede usar el script SQL y validate. Los cupos y concesiones de captura
# se gestionan en AuditService y no equivalen a la duración de la sesión de login.
spring.application.name=auditoria-endpoints-monolito
server.port=8080

# ===================================================================
# Configuracion de Base de Datos PostgreSQL mediante Variables de Entorno
# (Incluye valores por defecto de respaldo para entorno de desarrollo local)
# ===================================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auditoria_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# Configuracion de JPA / Hibernate (Operacion Sincrona/Bloqueante)
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# Configuracion de Thymeleaf
# ===================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Live Audit: una transacción por lote y secuencia compatible con batching.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.open-in-view=false
app.audit.origin=${AUDIT_ORIGIN:http://localhost:8080}
app.audit.admin-user=${AUDIT_ADMIN_USER:admin}
app.audit.admin-password=${AUDIT_ADMIN_PASSWORD:}
app.audit.operator-password=${AUDIT_OPERATOR_PASSWORD:}
app.audit.agent-password=${AUDIT_AGENT_PASSWORD:}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
# Activar COOKIE_SECURE=true al servir detrás de HTTPS.
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-binding-errors=never
